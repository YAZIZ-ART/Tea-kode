
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echoes of the Hollow - Heroes</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #100e1d;
  color: #eee8ff;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 25px 10px;
}

header h1 {
  color: #e8b84e;
  letter-spacing: 3px;
  font-size: 25px;
}

header p {
  color: #aaa0c4;
  font-size: 12px;
  letter-spacing: 2px;
}

.counter {
  color: #d8c5f5;
  margin-top: 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 15px;
  max-width: 1100px;
  margin: auto;
}

.hero {
  background: #211b35;
  border: 1px solid #493b61;
  border-radius: 12px;
  padding: 12px;
  text-align: center;
  transition: .2s;
}

.hero:hover {
  border-color: #e8b84e;
  transform: translateY(-4px);
}

.sprite {
  width: 100%;
  height: 155px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #171329;
  border-radius: 8px;
  margin-bottom: 10px;
}

canvas {
  width: 130px;
  height: 130px;
  image-rendering: pixelated;
}

.hero h3 {
  color: #f0d28b;
  font-size: 15px;
  margin: 8px 0;
}

.hero p {
  font-size: 11px;
  color: #bdb2d5;
  margin: 5px;
}

.tag {
  display: inline-block;
  background: #393052;
  color: #e8c779;
  padding: 5px 8px;
  border-radius: 5px;
  font-size: 10px;
  margin-top: 5px;
}

footer {
  text-align: center;
  color: #776d91;
  font-size: 11px;
  padding: 35px 0;
}
</style>
</head>

<body>

<header>
  <h1>ECHOES OF THE HOLLOW</h1>
  <p>HERO COLLECTION · PIXEL ART RPG</p>
  <div class="counter" id="counter">20 CHARACTERS</div>
</header>

<main class="grid" id="heroGrid"></main>

<footer>
  CHARACTER PREVIEW SYSTEM · VERSION 1.0
</footer>

<script type="module">

// ======================================
// IMPORT THARION SPRITE
// ======================================

let drawTharionSprite = null;

try {
  const art = await import("./src/hero-art.js");
  drawTharionSprite = art.drawTharionSprite;
} catch (error) {
  console.warn("Sprite Tharion belum ditemukan.", error);
}

// ======================================
// 20 HERO DATA
// ======================================

const heroes = [
  ["Tharion", "Lightning", "War Hammer"],
  ["Hero 02", "Fire", "Flame Sword"],
  ["Hero 03", "Water", "Trident"],
  ["Hero 04", "Ice", "Ice Blade"],
  ["Hero 05", "Earth", "Earth Axe"],
  ["Hero 06", "Wind", "Wind Bow"],
  ["Hero 07", "Light", "Holy Staff"],
  ["Hero 08", "Dark", "Shadow Scythe"],
  ["Hero 09", "Nature", "Nature Spear"],
  ["Hero 10", "Thunder", "Thunder Spear"],
  ["Hero 11", "Fire", "Twin Daggers"],
  ["Hero 12", "Water", "Water Staff"],
  ["Hero 13", "Ice", "Frost Bow"],
  ["Hero 14", "Earth", "Stone Hammer"],
  ["Hero 15", "Wind", "Wind Blade"],
  ["Hero 16", "Light", "Light Sword"],
  ["Hero 17", "Dark", "Dark Katana"],
  ["Hero 18", "Nature", "Forest Staff"],
  ["Hero 19", "Lightning", "Storm Axe"],
  ["Hero 20", "Arcane", "Magic Grimoire"]
];

// ======================================
// CREATE HERO CARDS
// ======================================

const grid = document.getElementById("heroGrid");

heroes.forEach((hero, index) => {

  const card = document.createElement("section");
  card.className = "hero";

  const id = index + 1;

  card.innerHTML = `
    <div class="sprite">
      <canvas width="100" height="100"
        id="sprite-${id}"></canvas>
    </div>

    <h3>${hero[0]}</h3>
    <p>Element: ${hero[1]}</p>
    <p>Weapon: ${hero[2]}</p>
    <span class="tag">
      ${id === 1 ? "MAIN HERO" : "HERO " + String(id).padStart(2,"0")}
    </span>
  `;

  grid.appendChild(card);
});

// ======================================
// TEMPORARY PIXEL HERO
// ======================================

function drawPlaceholder(ctx, index, time) {

  const colors = [
    "#e8b84e", "#d95b39", "#399dd9",
    "#9bd9ee", "#8a7650", "#8bd6d2",
    "#fff0a0", "#7950a5", "#5caa63",
    "#a9a0ef"
  ];

  const color = colors[index % colors.length];

  const bob = Math.sin(time * 0.003 + index) * 2;

  ctx.clearRect(0, 0, 100, 100);
  ctx.save();
  ctx.translate(0, bob);

  // Shadow
  ctx.fillStyle = "#090813";
  ctx.fillRect(28, 82, 44, 5);

  // Cape
  ctx.fillStyle = "#30204f";
  ctx.fillRect(29, 38, 42, 38);
  ctx.fillRect(24, 45, 8, 26);

  // Legs
  ctx.fillStyle = "#29243b";
  ctx.fillRect(35, 68, 12, 15);
  ctx.fillRect(53, 68, 12, 15);

  // Boots
  ctx.fillStyle = "#17132c";
  ctx.fillRect(32, 81, 17, 6);
  ctx.fillRect(51, 81, 17, 6);

  // Body outline
  ctx.fillStyle = "#17132c";
  ctx.fillRect(25, 35, 50, 38);

  // Armor
  ctx.fillStyle = "#393052";
  ctx.fillRect(28, 38, 44, 31);

  ctx.fillStyle = color;
  ctx.fillRect(33, 42, 34, 5);
  ctx.fillRect(44, 48, 12, 16);

  // Arms
  ctx.fillStyle = "#17132c";
  ctx.fillRect(19, 43, 11, 26);
  ctx.fillRect(70, 43, 11, 26);

  ctx.fillStyle = "#75618e";
  ctx.fillRect(21, 45, 7, 20);
  ctx.fillRect(72, 45, 7, 20);

  // Head
  ctx.fillStyle = "#17132c";
  ctx.fillRect(32, 9, 36, 34);

  ctx.fillStyle = "#d9d6e9";
  ctx.fillRect(35, 8, 30, 12);
  ctx.fillRect(32, 16, 36, 17);

  ctx.fillStyle = "#edbd91";
  ctx.fillRect(37, 22, 26, 16);

  // Eyes
  ctx.fillStyle = "#17132c";
  ctx.fillRect(41, 27, 5, 3);
  ctx.fillRect(54, 27, 5, 3);

  ctx.restore();
}

// ======================================
// ANIMATION
// ======================================

function animate(time) {

  heroes.forEach((hero, index) => {

    const canvas = document.getElementById(
      "sprite-" + (index + 1)
    );

    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    if (index === 0 && drawTharionSprite) {
      ctx.clearRect(0, 0, 100, 100);
      drawTharionSprite(ctx, 50, 30, 1.7, time);
    } else {
      drawPlaceholder(ctx, index, time);
    }

  });

  requestAnimationFrame(animate);
}

animate(0);

</script>

</body>
</html>
